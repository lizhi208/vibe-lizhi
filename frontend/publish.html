<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>发布闲置 - 二手集市</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">二手集市</a>
  </header>

  <main class="container narrow">
    <h1 class="page-title">发布闲置</h1>

    <!-- 第一步：上传照片 + AI 生成草稿 -->
    <section class="panel">
      <h2 class="panel-title">① 上传物品照片，AI 帮你写</h2>
      <input id="imageInput" type="file" accept="image/*" />
      <button id="aiBtn" class="btn btn-primary">一键生成标题 / 描述 / 参考价</button>
      <p id="aiTip" class="tip"></p>
    </section>

    <!-- 第二步：卖家二次编辑确认（AI 内容只作草稿，不可自动提交） -->
    <section class="panel">
      <h2 class="panel-title">② 确认并编辑发布信息</h2>
      <form id="publishForm">
        <label>标题
          <input id="titleInput" name="title" type="text" maxlength="50" required />
        </label>
        <label>描述
          <textarea id="descInput" name="description" rows="5" required></textarea>
        </label>
        <label>售价（元）
          <input id="priceInput" name="price" type="number" min="0" step="0.01" required />
          <small id="refPriceTip" class="tip"></small>
        </label>
        <label>分类
          <select id="categorySelect" name="categoryId" required></select>
        </label>
        <div class="form-actions">
          <a href="index.html" class="btn">取消</a>
          <button type="submit" class="btn btn-primary">确认发布</button>
        </div>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
