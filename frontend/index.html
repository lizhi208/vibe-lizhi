<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>二手集市</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">二手集市</a>
    <nav>
      <a href="publish.html" class="btn btn-primary">发布闲置</a>
    </nav>
  </header>

  <main class="container">
    <!-- 搜索 + 分类 -->
    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="搜索商品标题、描述…" />
      <button id="searchBtn" class="btn btn-primary">搜索</button>
      <div id="categoryBar" class="category-bar">
        <!-- 分类由 js/index.js 动态渲染 -->
      </div>
    </section>

    <!-- 商品列表 -->
    <section>
      <div id="productGrid" class="product-grid">
        <!-- 商品卡片由 js/index.js 动态渲染 -->
      </div>
      <p id="emptyTip" class="empty-tip" hidden>暂无符合条件的商品</p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
