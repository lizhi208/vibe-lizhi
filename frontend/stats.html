<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据统计 - 二手集市</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- T1 接入外部能力：ECharts 图表库（CDN 引入） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    .stats-head { display: flex; align-items: baseline; gap: 16px; margin: 8px 0 20px; }
    .stats-head h2 { margin: 0; font-size: 20px; }
    .stats-total { color: #7b8794; font-size: 14px; }
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .chart-card { background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 16px; }
    .chart-card h3 { margin: 0 0 8px; font-size: 15px; color: #33415c; }
    .chart-box { width: 100%; height: 320px; }
    .chart-box.wide { height: 260px; }
    .visit-table { width: 100%; border-collapse: collapse; margin-top: 4px; }
    .visit-table th, .visit-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef1f5; font-size: 14px; }
    .visit-table th { color: #7b8794; font-weight: 600; }
    @media (max-width: 720px) { .charts-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="index.html">二手集市</a>
    <nav>
      <a href="index.html" class="btn">返回列表</a>
      <a href="publish.html" class="btn btn-primary">发布闲置</a>
    </nav>
  </header>

  <main class="container">
    <div class="stats-head">
      <h2>商品统计看板</h2>
      <span class="stats-total">商品总数：<b id="totalCount">-</b> 件</span>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <h3>分类分布（在架商品）</h3>
        <div id="categoryChart" class="chart-box"></div>
      </div>
      <div class="chart-card">
        <h3>状态分布（全部商品）</h3>
        <div id="statusChart" class="chart-box"></div>
      </div>
    </div>

    <div class="chart-card" style="margin-top:20px;">
      <h3>页面访问量</h3>
      <div id="visitChart" class="chart-box wide"></div>
      <table class="visit-table" id="visitTable">
        <thead><tr><th>页面</th><th>访问次数</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
